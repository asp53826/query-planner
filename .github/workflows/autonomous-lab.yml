name: Autonomous Engineering Lab

on:
  schedule:
    - cron: "41 6 * * 2"
    - cron: "31 7 1 * *"
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: autonomous-lab-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  repo-medic:
    if: github.event_name != 'pull_request_target' && github.event.schedule != '31 7 1 * *'
    permissions:
      contents: read
    uses: asp53826/portfolio-ops/.github/workflows/repo-medic.yml@v1.0.0
    with:
      runtime: python
      runtime-version: "3.12"
      install-command: >-
        python -m pip install -e '.[dev]'
      test-command: >-
        python -m pytest -q
      verification-command: >-
        python bench/qerror.py --quick

  documentation-scribe:
    if: github.event_name != 'pull_request_target' && github.event.schedule != '31 7 1 * *'
    permissions:
      contents: read
      issues: write
    uses: asp53826/portfolio-ops/.github/workflows/documentation-scribe.yml@v1.0.0

  benchmark-keeper:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '31 7 1 * *'
    permissions:
      contents: read
    uses: asp53826/portfolio-ops/.github/workflows/benchmark-keeper.yml@v1.0.0
    with:
      runtime: python
      runtime-version: "3.12"
      install-command: >-
        python -m pip install -e '.[dev]'
      preflight-command: >-
        python -m pytest -q
      benchmark-command: >-
        python bench/qerror.py --quick && python bench/optimality.py --quick && python bench/cost_vs_time.py --quick

  dependency-caretaker:
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: write
    uses: asp53826/portfolio-ops/.github/workflows/dependency-caretaker.yml@v1.1.0

  dependency-merger:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
    uses: asp53826/portfolio-ops/.github/workflows/dependency-merger.yml@v1.1.0
